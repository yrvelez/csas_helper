<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSAS Helper</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom styles can be added here if necessary */
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center">
    <div class="container mx-auto px-4 py-12">
        <div class="max-w-6xl mx-auto bg-white rounded-lg shadow-lg overflow-hidden">
            <!-- Header -->
            <header class="bg-gradient-to-r from-blue-500 to-indigo-600 text-white py-6">
                <h1 class="text-4xl font-bold text-center">CSAS Helper</h1>
                <p class="mt-2 text-center text-lg">Streamlining Crowdsourced Adaptive Surveys</p>
            </header>

            <!-- Main Content -->
            <div class="md:flex">
                <!-- Left Column: Form -->
                <div class="md:w-1/2 p-8">
                    <form method="post" action="{% url 'main_page' %}" class="space-y-6">
                        {% csrf_token %}
                        
                        <!-- Initial Seed Items -->
                        <div>
                            <label for="issue" class="block text-sm font-medium text-gray-700">Enter Initial Seed Items (Semicolon delimited):</label>
                            <textarea id="issue" name="issue" rows="3" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500" placeholder="Seed Item 1; Seed Item 2; Seed Item 3"></textarea>
                        </div>

                        <!-- Prompt -->
                        <div>
                            <label for="prompt" class="block text-sm font-medium text-gray-700">Enter Prompt:</label>
                            <textarea id="prompt" name="prompt" rows="3" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500" placeholder="Default (Issue Classification)"></textarea>
                        </div>

                        <!-- API Selection -->
                        <div>
                            <label for="aiChoice" class="block text-sm font-medium text-gray-700">Select API:</label>
                            <select id="aiChoice" name="ai_choice" onchange="updateURLsAndSave()" class="mt-1 block w-full rounded-md border-gray-300 bg-white shadow-sm focus:border-indigo-500 focus:ring-indigo-500">
                                <option value="openai" {% if ai_choice == 'openai' %}selected{% endif %}>OpenAI (GPT-4o Mini)</option>
                                <option value="llama" {% if ai_choice == 'llama' %}selected{% endif %}>OpenRouter (Llama 3.1 70B)</option>
                            </select>
                        </div>

                        <!-- Number of Dynamic Items -->
                        <div>
                            <label for="num_items" class="block text-sm font-medium text-gray-700">Number of Dynamic Items:</label>
                            <input type="text" id="num_items" name="num_items" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500" placeholder="Default (3)">
                        </div>

                        <!-- Minimum Scale Value -->
                        <div>
                            <label for="min_scale" class="block text-sm font-medium text-gray-700">Minimum Scale Value:</label>
                            <input type="text" id="min_scale" name="min_scale" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500" placeholder="Default (1)">
                        </div>

                        <!-- Maximum Scale Value -->
                        <div>
                            <label for="max_scale" class="block text-sm font-medium text-gray-700">Maximum Scale Value:</label>
                            <input type="text" id="max_scale" name="max_scale" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500" placeholder="Default (5)">
                        </div>

                        <!-- Buttons -->
                        <div class="flex space-x-4">
                            <button type="button" onclick="saveSessionData()" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                                1. Save Settings
                            </button>
                            <button type="submit" class="flex-1 bg-green-600 hover:bg-green-700 text-white font-semibold py-2 px-4 rounded-md focus:outline-none focus:ring-2 focus:ring-green-500">
                                2. Upload Seed Items
                            </button>
                        </div>
                    </form>
                </div>

                <!-- Right Column: Links and Instructions -->
                <div class="md:w-1/2 bg-gray-50 p-8">
                    <!-- Easier CSAS Implementation -->
                    <section class="mb-8">
                        <h2 class="text-2xl font-semibold text-gray-800 mb-4">Easier CSAS Implementation</h2>
                        <div class="space-y-4">
                            <!-- Set Question Text -->
                            <div>
                                <label for="survey_text" class="block text-sm font-medium text-gray-700">Set Question Text:</label>
                                <textarea id="survey_text" name="survey_text" rows="3" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500" placeholder="Rate on a 1-5 scale how important the issue is to you."></textarea>
                                <button type="button" onclick="saveSessionData()" class="mt-2 w-full bg-blue-500 hover:bg-blue-600 text-white font-medium py-2 px-4 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-400">
                                    Save Question Text
                                </button>
                            </div>

                            <!-- Copy Qualtrics URL -->
                            <div>
                                <label class="block text-sm font-medium text-gray-700">Qualtrics Integration URL:</label>
                                <div class="flex items-center mt-1">
                                    <input type="text" value="{{ ez_url }}" id="EZUrl" class="flex-1 rounded-l-md border border-gray-300 py-2 px-3 text-gray-700 focus:border-indigo-500 focus:ring-indigo-500" readonly>
                                    <button onclick="copyToClipboard('EZUrl')" class="bg-indigo-600 hover:bg-indigo-700 text-white py-2 px-4 rounded-r-md">
                                        Copy
                                    </button>
                                </div>
                            </div>
                        </div>
                    </section>

                    <!-- Customizable CSAS Implementation -->
                    <section>
                        <h2 class="text-2xl font-semibold text-gray-800 mb-4">Customizable CSAS Implementation</h2>
                        <div class="space-y-4">
                            <!-- Input Step URL -->
                            <div>
                                <label class="block text-sm font-medium text-gray-700">Input Step URL:</label>
                                <div class="flex items-center mt-1">
                                    <input type="text" value="{{ dynamic_issue_url_oai }}" id="dynamicIssueUrl" class="flex-1 rounded-l-md border border-gray-300 py-2 px-3 text-gray-700 focus:border-indigo-500 focus:ring-indigo-500" readonly>
                                    <button onclick="copyToClipboard('dynamicIssueUrl')" class="bg-indigo-600 hover:bg-indigo-700 text-white py-2 px-4 rounded-r-md">
                                        Copy
                                    </button>
                                </div>
                            </div>

                            <!-- Sampling Step URL -->
                            <div>
                                <label class="block text-sm font-medium text-gray-700">Sampling Step URL:</label>
                                <div class="flex items-center mt-1">
                                    <input type="text" value="{{ select_questions_simulation_url }}" id="selectQuestionsSimulationUrl" class="flex-1 rounded-l-md border border-gray-300 py-2 px-3 text-gray-700 focus:border-indigo-500 focus:ring-indigo-500" readonly>
                                    <button onclick="copyToClipboard('selectQuestionsSimulationUrl')" class="bg-indigo-600 hover:bg-indigo-700 text-white py-2 px-4 rounded-r-md">
                                        Copy
                                    </button>
                                </div>
                            </div>

                            <!-- Updating Step URL -->
                            <div>
                                <label class="block text-sm font-medium text-gray-700">Updating Step URL:</label>
                                <div class="flex items-center mt-1">
                                    <input type="text" value="{{ update_rating_url }}" id="updateRatingsUrl" class="flex-1 rounded-l-md border border-gray-300 py-2 px-3 text-gray-700 focus:border-indigo-500 focus:ring-indigo-500" readonly>
                                    <button onclick="copyToClipboard('updateRatingsUrl')" class="bg-indigo-600 hover:bg-indigo-700 text-white py-2 px-4 rounded-r-md">
                                        Copy
                                    </button>
                                </div>
                            </div>
                        </div>
                    </section>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            updateURLs();
        });

        function updateURLsAndSave() {
            const aiChoice = document.getElementById("aiChoice").value;
            const dynamicIssueUrl = document.getElementById("dynamicIssueUrl");
            if (aiChoice === 'openai') {
                dynamicIssueUrl.value = '{{ dynamic_issue_url_oai }}';
            } else if (aiChoice === 'llama') {
                dynamicIssueUrl.value = '{{ dynamic_issue_url_llama }}';
                saveSessionData();  // Automatically save session data when Llama is selected
            }
        }

        function copyToClipboard(elementId) {
            const copyText = document.getElementById(elementId);
            navigator.clipboard.writeText(copyText.value)
                .then(() => {
                    alert('Copied: ' + copyText.value);
                })
                .catch(err => {
                    console.error('Failed to copy: ', err);
                });
        }

        function saveSessionData() {
            const issue = document.getElementById('issue').value;
            const prompt = document.getElementById('prompt').value;
            const aiChoice = document.getElementById('aiChoice').value;
            const num_items = document.getElementById('num_items').value;
            const min_scale = document.getElementById('min_scale').value;
            const max_scale = document.getElementById('max_scale').value;
            const survey_text = document.getElementById('survey_text').value;

            const data = {
                'issue': issue,
                'prompt': prompt,
                'ai_choice': aiChoice,
                'num_items': num_items,
                'min_scale': min_scale,
                'max_scale': max_scale,
                'survey_text': survey_text
            };

            fetch('{% url "save_session_data" %}', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': '{{ csrf_token }}'
                },
                body: JSON.stringify(data)
            })
            .then(response => response.json())
            .then(data => {
                alert('Session data saved successfully');
                console.log(data);
            })
            .catch((error) => {
                console.error('Error:', error);
            });
        }
    </script>
</body>
</html>
